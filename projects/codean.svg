<svg width="560" height="92" viewBox="0 0 560 92" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card 4: Cyber Purple & Indigo Gradient -->
    <linearGradient id="bgCodean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Distinct Background -->
  <rect width="560" height="92" rx="14" fill="url(#bgCodean)"/>
  
