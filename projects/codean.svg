  <rect x="214" y="64" width="78" height="18" rx="4" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.3"/>
  <text x="253" y="77" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">PostgreSQL</text>

  <rect x="298" y="64" width="58" height="18" rx="4" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.3"/>
