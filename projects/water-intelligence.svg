<svg width="560" height="92" viewBox="0 0 560 92" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; }
    .desc { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 400; }
    .card-border { stroke: #d0d7de; }
    .pill-bg { fill: #f6f8fa; stroke: #d0d7de; }
    .arrow { stroke: #656d76; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f0f6fc; }
      .desc { fill: #8b949e; }
      .card-border { stroke: #30363d; }
      .pill-bg { fill: #161b22; stroke: #30363d; }
      .arrow { stroke: #8b949e; }
    }
  </style>

  <defs>
    <linearGradient id="accentWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Transparent Background Card with Adaptive Border -->
  <rect x="1" y="1" width="558" height="90" rx="14" fill="none" class="card-border" stroke-width="1.2"/>
  
  <!-- Left accent bar -->
  <rect x="1" y="24" width="4" height="44" rx="2" fill="url(#accentWater)"/>

  <!-- Icon Container -->
  <rect x="22" y="20" width="52" height="52" rx="12" fill="#0284c7" fill-opacity="0.12" stroke="#0ea5e9" stroke-opacity="0.3"/>
  <!-- Telemetry / Water Drop Icon -->
  <path d="M48 28C48 28 36 43 36 50C36 56.627 41.373 62 48 62C54.627 62 60 56.627 60 50C60 43 48 28 48 28Z" fill="url(#accentWater)"/>
  <circle cx="48" cy="52" r="3.5" fill="#ffffff" fill-opacity="0.95"/>

  <!-- Title -->
  <text x="88" y="38" class="title">Water Operations Intelligence Platform</text>

  <!-- Description -->
  <text x="88" y="56" class="desc">Enterprise water telemetry, real-time data pipelines &amp; monitoring suite</text>

  <!-- Tech tags -->
  <rect x="88" y="64" width="48" height="18" rx="4" class="pill-bg"/>
  <text x="112" y="77" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#0284c7" text-anchor="middle">React</text>

  <rect x="142" y="64" width="54" height="18" rx="4" class="pill-bg"/>
  <text x="169" y="77" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="middle">Python</text>

  <rect x="202" y="64" width="66" height="18" rx="4" class="pill-bg"/>
  <text x="235" y="77" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#059669" text-anchor="middle">Supabase</text>

  <rect x="274" y="64" width="84" height="18" rx="4" class="pill-bg"/>
  <text x="316" y="77" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#7c3aed" text-anchor="middle">Data Pipelines</text>

  <!-- Arrow Indicator -->
  <path d="M528 46L521 39M528 46L521 53" class="arrow" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
