  </text>

  <!-- Tech tags -->
  <rect x="86" y="64" width="50" height="18" rx="4" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.3"/>
  <text x="111" y="77" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">React</text>

  <rect x="142" y="64" width="56" height="18" rx="4" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.3"/>
  <text x="170" y="77" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">Python</text>

  <rect x="204" y="64" width="68" height="18" rx="4" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.3"/>
  <text x="238" y="77" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">Supabase</text>

  <rect x="278" y="64" width="86" height="18" rx="4" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.3"/>
