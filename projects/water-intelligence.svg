<svg width="560" height="92" viewBox="0 0 560 92" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card 1: Ocean Blue & Cyan Gradient -->
    <linearGradient id="bgWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Distinct Background -->
  <rect width="560" height="92" rx="14" fill="url(#bgWater)"/>
  
  <!-- Subtle inner border overlay -->
  <rect x="1" y="1" width="558" height="90" rx="13" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2"/>

  <!-- Icon Container -->
  <rect x="20" y="20" width="52" height="52" rx="12" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.35"/>
  <!-- Water Drop Icon -->
  <path d="M46 28C46 28 34 43 34 50C34 56.627 39.373 62 46 62C52.627 62 58 56.627 58 50C58 43 46 28 46 28Z" fill="#ffffff"/>
