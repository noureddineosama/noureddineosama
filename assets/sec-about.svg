<svg width="900" height="64" viewBox="0 0 900 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgAbout" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#14182E"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderAbout" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Accent Bar Gradient -->
    <linearGradient id="barAbout" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Icon Background -->
    <linearGradient id="iconBgAbout" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="900" height="64" rx="10" fill="url(#bgAbout)"/>
  <rect x="0.75" y="0.75" width="898.5" height="62.5" rx="9.25" stroke="url(#borderAbout)" stroke-width="1.5"/>

  <!-- Left Accent Bar -->
  <path d="M0 10C0 4.477 4.477 0 10 0H14V64H10C4.477 64 0 59.523 0 54V10Z" fill="url(#barAbout)"/>

  <!-- Left Icon Badge -->
  <g transform="translate(28, 14)">
    <rect width="36" height="36" rx="8" fill="url(#iconBgAbout)" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
    <!-- Terminal / User Code Icon -->
    <path d="M12 14L16 18L12 22M19 22H24" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Section Text -->
  <g transform="translate(76, 0)">
    <!-- Category Mono Tag -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="600" fill="#38BDF8" letter-spacing="1.2">
      // 01. PROFILE &amp; PHILOSOPHY
    </text>

    <!-- Main Title & Subtitle -->
    <text x="0" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <tspan font-size="16" font-weight="700" fill="#F8FAFC">About Me</tspan>
      <tspan dx="10" font-size="13" font-weight="400" fill="#94A3B8">— Backend Engineer focused on clean, scalable systems</tspan>
    </text>
  </g>

  <!-- Right Side Tag -->
  <g transform="translate(746, 20)">
    <rect width="128" height="24" rx="6" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    <circle cx="12" cy="12" r="3" fill="#38BDF8"/>
    <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#CBD5E1" letter-spacing="0.5">
      CORE IDENTITY
    </text>
  </g>
</svg>
