<svg viewBox="0 0 740 260" fill="none" xmlns="http://www.w3.org/2000/svg" style="max-width:740px;display:block;">
  <defs>
    <!-- Vibrant Glowing Outer Border -->
    <linearGradient id="frameBorderMatrix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="25%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Subtle Glass Background -->
    <linearGradient id="glassBgMatrix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <style>
    .cat-title { fill: #0F172A; }
    .chip-box { fill: rgba(148, 163, 184, 0.08); stroke: rgba(148, 163, 184, 0.25); }
    .chip-text { fill: #334155; }
    .inner-divider { stroke: rgba(148, 163, 184, 0.2); }

    @media (prefers-color-scheme: dark) {
      .cat-title { fill: #FFFFFF; }
      .chip-box { fill: rgba(255, 255, 255, 0.08); stroke: rgba(255, 255, 255, 0.18); }
      .chip-text { fill: #E2E8F0; }
      .inner-divider { stroke: rgba(255, 255, 255, 0.12); }
    }
  </style>

  <!-- Clear Vibrant Outer Frame -->
  <rect x="0.75" y="0.75" width="738.5" height="258.5" rx="12" stroke="url(#frameBorderMatrix)" stroke-width="1.5" fill="url(#glassBgMatrix)"/>

  <!-- Vertical Divider between Column 1 and Column 2 -->
  <line x1="370" y1="16" x2="370" y2="244" class="inner-divider" stroke-width="1.5"/>

  <!-- Horizontal Dividers -->
  <line x1="20" y1="94" x2="350" y2="94" class="inner-divider" stroke-width="1"/>
  <line x1="390" y1="94" x2="720" y2="94" class="inner-divider" stroke-width="1"/>
  <line x1="20" y1="174" x2="350" y2="174" class="inner-divider" stroke-width="1"/>
  <line x1="390" y1="174" x2="720" y2="174" class="inner-divider" stroke-width="1"/>

  <!-- ==================== ROW 1 ==================== -->

  <!-- Cell 1: Languages & Runtime -->
  <g transform="translate(20, 16)">
    <circle cx="4" cy="11" r="3.5" fill="#6366F1"/>
    <text x="14" y="15" class="cat-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Languages &amp; Runtime</text>

    <!-- Chips -->
    <g transform="translate(0, 26)">
      <rect width="52" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="26" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">C# 14</text>

      <rect x="58" width="62" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="89" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">.NET 10</text>

      <rect x="126" width="102" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="177" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">ASP.NET Core</text>

      <rect x="234" width="62" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="265" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">EF Core</text>
    </g>
  </g>

  <!-- Cell 2: Databases & Storage -->
  <g transform="translate(390, 16)">
    <circle cx="4" cy="11" r="3.5" fill="#0284C7"/>
    <text x="14" y="15" class="cat-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Databases &amp; Storage</text>

    <!-- Chips -->
    <g transform="translate(0, 26)">
      <rect width="82" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="41" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">PostgreSQL</text>

      <rect x="88" width="80" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="128" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">SQL Server</text>

      <rect x="174" width="54" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="201" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Redis</text>

      <rect x="234" width="52" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="260" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">T-SQL</text>
    </g>
  </g>

  <!-- ==================== ROW 2 ==================== -->

  <!-- Cell 3: APIs & Messaging -->
  <g transform="translate(20, 96)">
    <circle cx="4" cy="11" r="3.5" fill="#0D9488"/>
    <text x="14" y="15" class="cat-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">APIs &amp; Messaging</text>

    <!-- Chips -->
    <g transform="translate(0, 26)">
      <rect width="90" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="45" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">RESTful APIs</text>

      <rect x="96" width="60" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="126" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">MediatR</text>

      <rect x="162" width="60" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="192" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Dapper</text>

      <rect x="228" width="60" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="258" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">SignalR</text>
    </g>
  </g>

  <!-- Cell 4: Cloud & DevOps -->
  <g transform="translate(390, 96)">
    <circle cx="4" cy="11" r="3.5" fill="#7C3AED"/>
    <text x="14" y="15" class="cat-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Cloud &amp; DevOps</text>

    <!-- Chips -->
    <g transform="translate(0, 26)">
      <rect width="58" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="29" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Docker</text>

      <rect x="64" width="102" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="115" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">GitHub Actions</text>

      <rect x="172" width="50" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="197" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Azure</text>

      <rect x="228" width="88" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="272" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">CI/CD Pipeline</text>
    </g>
  </g>

  <!-- ==================== ROW 3 ==================== -->

  <!-- Cell 5: Architecture & Design -->
  <g transform="translate(20, 176)">
    <circle cx="4" cy="11" r="3.5" fill="#E11D48"/>
    <text x="14" y="15" class="cat-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Architecture &amp; Design</text>

    <!-- Chips -->
    <g transform="translate(0, 26)">
      <rect width="118" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="59" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Clean Architecture</text>

      <rect x="124" width="52" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="150" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">CQRS</text>

      <rect x="182" width="48" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="206" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">DDD</text>

      <rect x="236" width="54" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="263" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">SOLID</text>
    </g>
  </g>

  <!-- Cell 6: Testing & Quality -->
  <g transform="translate(390, 176)">
    <circle cx="4" cy="11" r="3.5" fill="#10B981"/>
    <text x="14" y="15" class="cat-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Testing &amp; Quality</text>

    <!-- Chips -->
    <g transform="translate(0, 26)">
      <rect width="52" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="26" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">xUnit</text>

      <rect x="58" width="50" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="83" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Moq</text>

      <rect x="114" width="108" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="168" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">FluentAssertions</text>

      <rect x="228" width="76" height="24" rx="5" class="chip-box" stroke-width="1"/>
      <text x="266" y="16" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Integration</text>
    </g>
  </g>
</svg>
