    <!-- Chips -->
    <g transform="translate(0, 28)">
      <rect width="66" height="26" rx="6" class="chip-box" stroke-width="1"/>
      <text x="33" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Docker</text>

