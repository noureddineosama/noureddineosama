    <text x="14" y="15" class="cat-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">Databases &amp; Storage</text>

    <!-- Chips -->
    <g transform="translate(0, 28)">
