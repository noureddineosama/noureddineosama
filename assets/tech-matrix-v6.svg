    <text x="14" y="15" class="cat-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">Architecture &amp; Design</text>

    <!-- Chips -->
    <g transform="translate(0, 28)">
      <rect width="134" height="26" rx="6" class="chip-box" stroke-width="1"/>
      <text x="67" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Clean Architecture</text>

      <rect x="142" width="60" height="26" rx="6" class="chip-box" stroke-width="1"/>
      <text x="172" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">CQRS</text>

      <rect x="210" width="54" height="26" rx="6" class="chip-box" stroke-width="1"/>
      <text x="237" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">DDD</text>

      <rect x="272" width="60" height="26" rx="6" class="chip-box" stroke-width="1"/>
      <text x="302" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">SOLID</text>
    </g>
  </g>

  <!-- Cell 6: Testing & Quality -->
  <g transform="translate(454, 192)">
    <circle cx="4" cy="11" r="3.5" fill="#10B981"/>
    <text x="14" y="15" class="cat-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">Testing &amp; Quality</text>

    <!-- Chips -->
    <g transform="translate(0, 28)">
      <rect width="60" height="26" rx="6" class="chip-box" stroke-width="1"/>
      <text x="30" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">xUnit</text>

      <rect x="68" width="56" height="26" rx="6" class="chip-box" stroke-width="1"/>
      <text x="96" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Moq</text>

      <rect x="132" width="118" height="26" rx="6" class="chip-box" stroke-width="1"/>
      <text x="191" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">FluentAssertions</text>

      <rect x="258" width="86" height="26" rx="6" class="chip-box" stroke-width="1"/>
      <text x="301" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Integration</text>
