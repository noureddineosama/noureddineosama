    <!-- Chips -->
    <g transform="translate(0, 28)">
      <rect width="98" height="26" rx="6" class="chip-box" stroke-width="1"/>
      <text x="49" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">RESTful APIs</text>

      <rect x="106" width="68" height="26" rx="6" class="chip-box" stroke-width="1"/>
      <text x="140" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">MediatR</text>

      <rect x="182" width="66" height="26" rx="6" class="chip-box" stroke-width="1"/>
      <text x="215" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Dapper</text>

      <rect x="256" width="66" height="26" rx="6" class="chip-box" stroke-width="1"/>
      <text x="289" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">SignalR</text>
