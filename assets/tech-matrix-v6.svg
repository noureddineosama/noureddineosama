<svg viewBox="0 0 860 280" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:860px;display:block;">
  <defs>
    <!-- Vibrant Glowing Outer Border -->
    <linearGradient id="frameBorderMatrix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="25%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Subtle Glass Background -->
    <linearGradient id="glassBgMatrix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <style>
    .cat-title { fill: #0F172A; }
    .chip-box { fill: rgba(148, 163, 184, 0.08); stroke: rgba(148, 163, 184, 0.25); }
    .chip-text { fill: #334155; }
    .inner-divider { stroke: rgba(148, 163, 184, 0.2); }

    @media (prefers-color-scheme: dark) {
      .cat-title { fill: #FFFFFF; }
      .chip-box { fill: rgba(255, 255, 255, 0.08); stroke: rgba(255, 255, 255, 0.18); }
      .chip-text { fill: #E2E8F0; }
      .inner-divider { stroke: rgba(255, 255, 255, 0.12); }
    }
  </style>

  <!-- Clear Vibrant Outer Frame -->
  <rect x="0.75" y="0.75" width="858.5" height="278.5" rx="12" stroke="url(#frameBorderMatrix)" stroke-width="1.5" fill="url(#glassBgMatrix)"/>

  <!-- Vertical Divider between Column 1 and Column 2 -->
  <line x1="430" y1="18" x2="430" y2="262" class="inner-divider" stroke-width="1.5"/>

  <!-- Horizontal Dividers -->
  <line x1="24" y1="102" x2="406" y2="102" class="inner-divider" stroke-width="1"/>
  <line x1="454" y1="102" x2="836" y2="102" class="inner-divider" stroke-width="1"/>
  <line x1="24" y1="188" x2="406" y2="188" class="inner-divider" stroke-width="1"/>
  <line x1="454" y1="188" x2="836" y2="188" class="inner-divider" stroke-width="1"/>

  <!-- ==================== ROW 1 ==================== -->

  <!-- Cell 1: Languages & Runtime -->
  <g transform="translate(24, 18)">
    <circle cx="4" cy="11" r="3.5" fill="#6366F1"/>
    <text x="14" y="15" class="cat-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">Languages &amp; Runtime</text>

    <!-- Chips -->
    <g transform="translate(0, 28)">
      <rect width="58" height="26" rx="6" class="chip-box" stroke-width="1"/>
      <text x="29" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">C# 14</text>

      <rect x="66" width="68" height="26" rx="6" class="chip-box" stroke-width="1"/>
      <text x="100" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">.NET 10</text>

      <rect x="142" width="112" height="26" rx="6" class="chip-box" stroke-width="1"/>
      <text x="198" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">ASP.NET Core</text>

      <rect x="262" width="70" height="26" rx="6" class="chip-box" stroke-width="1"/>
      <text x="297" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">EF Core</text>
    </g>
  </g>

  <!-- Cell 2: Databases & Storage -->
  <g transform="translate(454, 18)">
