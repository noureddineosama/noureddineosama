      <text x="45" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">PostgreSQL</text>

      <rect x="98" width="88" height="26" rx="6" class="chip-box" stroke-width="1"/>
      <text x="142" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">SQL Server</text>

      <rect x="194" width="60" height="26" rx="6" class="chip-box" stroke-width="1"/>
      <text x="224" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Redis</text>

      <rect x="262" width="58" height="26" rx="6" class="chip-box" stroke-width="1"/>
      <text x="291" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">T-SQL</text>
