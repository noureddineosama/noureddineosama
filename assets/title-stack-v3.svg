<svg viewBox="0 0 650 96" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:650px;display:block;">
  <defs>
    <!-- Vibrant Visible Frame Border (Visible on Dark & Light) -->
    <linearGradient id="frameBorderStack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="35%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Subtle Glass Background -->
    <linearGradient id="glassBgStack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Accent Bar -->
    <linearGradient id="barStack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <style>
    .title-main { fill: #0F172A; }
    .title-sub { fill: #475569; }
    .tag-text { fill: #6366F1; }
    .icon-box { fill: rgba(99, 102, 241, 0.12); stroke: #6366F1; }

    @media (prefers-color-scheme: dark) {
      .title-main { fill: #FFFFFF; }
      .title-sub { fill: #94A3B8; }
      .tag-text { fill: #A78BFA; }
      .icon-box { fill: rgba(167, 139, 250, 0.15); stroke: #A78BFA; }
    }
  </style>

  <!-- Clear Vibrant Frame -->
  <rect x="0.75" y="0.75" width="648.5" height="94.5" rx="14" stroke="url(#frameBorderStack)" stroke-width="1.5" fill="url(#glassBgStack)"/>

  <!-- Left Accent Bar -->
  <path d="M0 14C0 6.268 6.268 0 14 0H18V96H14C6.268 96 0 89.732 0 82V14Z" fill="url(#barStack)"/>

  <!-- Left Icon Badge -->
  <g transform="translate(30, 20)">
    <rect width="56" height="56" rx="12" class="icon-box" stroke-width="1.2"/>
    <!-- Stack / Layers Icon -->
    <path d="M28 18L16 24L28 30L40 24L28 18Z" stroke="#6366F1" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M16 30L28 36L40 30" stroke="#6366F1" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Section Text -->
  <g transform="translate(104, 0)">
    <!-- Category Tag -->
    <text x="0" y="38" class="tag-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.5">
      // 02. ARSENAL &amp; CAPABILITIES
    </text>

    <!-- Main Title & Subtitle -->
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <tspan font-size="26" font-weight="800" class="title-main">Tech Stack</tspan>
      <tspan dx="12" font-size="16" font-weight="500" class="title-sub">— Technologies, tools &amp; frameworks I build with daily</tspan>
    </text>
  </g>
</svg>
