<svg viewBox="0 0 320 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;">
  <defs>
    <!-- Vibrant Glowing Border -->
    <linearGradient id="badgeBorderStats" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Subtle Glass Background -->
    <linearGradient id="badgeGlassStats" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Left Accent Bar -->
    <linearGradient id="barStatsPill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <style>
    .title-main { fill: #0F172A; }
    .tag-text { fill: #059669; }
    .icon-box { fill: rgba(16, 185, 129, 0.12); stroke: #10B981; }

    @media (prefers-color-scheme: dark) {
      .title-main { fill: #FFFFFF; }
      .tag-text { fill: #34D399; }
      .icon-box { fill: rgba(52, 211, 153, 0.15); stroke: #34D399; }
    }
  </style>

  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="46.5" rx="10" stroke="url(#badgeBorderStats)" stroke-width="1.5" fill="url(#badgeGlassStats)"/>

  <!-- Left Accent -->
  <path d="M0 10C0 4.477 4.477 0 10 0H12V48H10C4.477 48 0 43.523 0 38V10Z" fill="url(#barStatsPill)"/>

  <!-- Icon Badge -->
  <g transform="translate(20, 9)">
    <rect width="30" height="30" rx="7" class="icon-box" stroke-width="1"/>
    <!-- Pulse Icon -->
    <path d="M9 19L12 12L15 17L18 10L21 19" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text -->
  <g transform="translate(60, 0)">
    <text x="0" y="19" class="tag-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1">
      // 03. METRICS &amp; VELOCITY
    </text>
    <text x="0" y="37" class="title-main" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="-0.3">
      GitHub Activity
    </text>
  </g>
</svg>
