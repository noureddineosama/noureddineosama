<svg viewBox="0 0 820 54" fill="none" xmlns="http://www.w3.org/2000/svg" style="max-width:820px;display:block;">
  <defs>
    <!-- Frame Border -->
    <linearGradient id="frameBorderStats6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="35%" stop-color="#059669"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Glass Background -->
    <linearGradient id="glassBgStats6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Left Accent Bar -->
    <linearGradient id="barStats6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <style>
    .title-main { fill: #0F172A; }
    .title-sub { fill: #64748B; }
    .tag-text { fill: #059669; }
    .icon-box { fill: rgba(16, 185, 129, 0.1); stroke: #10B981; }
    .status-box { fill: rgba(16, 185, 129, 0.08); stroke: #10B981; }
    .status-text { fill: #10B981; }

    @media (prefers-color-scheme: dark) {
      .title-main { fill: #FFFFFF; }
      .title-sub { fill: #94A3B8; }
      .tag-text { fill: #34D399; }
      .icon-box { fill: rgba(52, 211, 153, 0.15); stroke: #34D399; }
      .status-box { fill: rgba(52, 211, 153, 0.1); stroke: rgba(52, 211, 153, 0.4); }
      .status-text { fill: #34D399; }
    }
  </style>

  <!-- Frame -->
  <rect x="0.75" y="0.75" width="818.5" height="52.5" rx="10" stroke="url(#frameBorderStats6)" stroke-width="1.5" fill="url(#glassBgStats6)"/>

  <!-- Left Accent Bar -->
  <path d="M0 10C0 4.477 4.477 0 10 0H12V54H10C4.477 54 0 49.523 0 44V10Z" fill="url(#barStats6)"/>

  <!-- Left Icon Badge -->
  <g transform="translate(22, 10)">
    <rect width="34" height="34" rx="8" class="icon-box" stroke-width="1"/>
    <!-- Pulse Icon -->
    <path d="M10 22L14 14L18 20L22 12L25 22" stroke="#10B981" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Section Text -->
  <g transform="translate(68, 0)">
    <text x="0" y="20" class="tag-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1.2">
      // 03. METRICS &amp; VELOCITY
    </text>
    <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <tspan font-size="16" font-weight="800" class="title-main">GitHub Activity</tspan>
      <tspan dx="10" font-size="13" font-weight="500" class="title-sub">— Contribution streak, commits &amp; open-source velocity</tspan>
    </text>
  </g>

  <!-- Right Status Pill -->
  <g transform="translate(700, 14)">
    <rect width="96" height="26" rx="13" class="status-box" stroke-width="1"/>
    <circle cx="16" cy="13" r="3.5" fill="#10B981"/>
    <text x="26" y="17" class="status-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" letter-spacing="0.8">
      STREAK
    </text>
  </g>
</svg>
