<svg viewBox="0 0 820 270" fill="none" xmlns="http://www.w3.org/2000/svg" style="max-width:820px;display:block;">
  <defs>
    <!-- Frame Border -->
    <linearGradient id="frameBorderMatrix8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="25%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Glass Background -->
    <linearGradient id="glassBgMatrix8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.05"/>
