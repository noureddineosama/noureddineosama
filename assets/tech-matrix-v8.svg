  <!-- Clear Vibrant Outer Frame -->
  <rect x="0.75" y="0.75" width="818.5" height="268.5" rx="12" stroke="url(#frameBorderMatrix8)" stroke-width="1.5" fill="url(#glassBgMatrix8)"/>

  <!-- Vertical Divider between Column 1 and Column 2 -->
  <line x1="410" y1="16" x2="410" y2="254" class="inner-divider" stroke-width="1.5"/>

  <!-- Horizontal Dividers -->
  <line x1="24" y1="98" x2="386" y2="98" class="inner-divider" stroke-width="1"/>
  <line x1="434" y1="98" x2="796" y2="98" class="inner-divider" stroke-width="1"/>
  <line x1="24" y1="180" x2="386" y2="180" class="inner-divider" stroke-width="1"/>
