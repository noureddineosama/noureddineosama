    <text x="18" y="16" class="cat-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Databases &amp; Storage</text>

    <!-- Sub-row 1 -->
    <g transform="translate(0, 36)">
