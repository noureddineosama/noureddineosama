      <rect x="158" width="144" height="36" rx="8" class="chip-box" stroke-width="1"/>
      <text x="230" y="23" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">CQRS Pattern</text>
    </g>

    <!-- Sub-row 2 -->
    <g transform="translate(0, 82)">
      <rect width="144" height="36" rx="8" class="chip-box" stroke-width="1"/>
      <text x="72" y="23" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">DDD Concepts</text>

      <rect x="158" width="144" height="36" rx="8" class="chip-box" stroke-width="1"/>
      <text x="230" y="23" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">SOLID Principles</text>
