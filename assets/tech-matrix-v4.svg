  <g transform="translate(354, 384)">
    <circle cx="5" cy="11" r="4.5" fill="#10B981"/>
    <text x="18" y="16" class="cat-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Testing &amp; Quality</text>

    <!-- Sub-row 1 -->
    <g transform="translate(0, 36)">
      <rect width="144" height="36" rx="8" class="chip-box" stroke-width="1"/>
      <text x="72" y="23" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">xUnit</text>

      <rect x="158" width="144" height="36" rx="8" class="chip-box" stroke-width="1"/>
      <text x="230" y="23" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Moq</text>
    </g>

    <!-- Sub-row 2 -->
    <g transform="translate(0, 82)">
      <rect width="144" height="36" rx="8" class="chip-box" stroke-width="1"/>
      <text x="72" y="23" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">FluentAssertions</text>

      <rect x="158" width="144" height="36" rx="8" class="chip-box" stroke-width="1"/>
      <text x="230" y="23" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Integration Tests</text>
