<svg width="900" height="60" viewBox="0 0 900 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant Visible Frame Border (Visible on Dark & Light) -->
    <linearGradient id="frameBorderAbout" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="25%" stop-color="#6366F1"/>
      <stop offset="75%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Subtle Glass Background -->
    <linearGradient id="glassBgAbout" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Accent Bar -->
    <linearGradient id="barAbout" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <style>
    .title-main { fill: #0F172A; }
    .title-sub { fill: #475569; }
    .tag-text { fill: #0284C7; }
    .icon-box { fill: rgba(2, 132, 199, 0.1); stroke: #0284C7; }

    @media (prefers-color-scheme: dark) {
      .title-main { fill: #FFFFFF; }
      .title-sub { fill: #94A3B8; }
      .tag-text { fill: #38BDF8; }
      .icon-box { fill: rgba(56, 189, 248, 0.15); stroke: #38BDF8; }
    }
  </style>

  <!-- Clear Vibrant Frame (100% visible on Dark & Light) -->
  <rect x="0.75" y="0.75" width="898.5" height="58.5" rx="10" stroke="url(#frameBorderAbout)" stroke-width="1.5" fill="url(#glassBgAbout)"/>

  <!-- Left Accent Bar -->
  <path d="M0 10C0 4.477 4.477 0 10 0H14V60H10C4.477 60 0 55.523 0 50V10Z" fill="url(#barAbout)"/>

  <!-- Left Icon Badge -->
  <g transform="translate(26, 12)">
    <rect width="36" height="36" rx="8" class="icon-box" stroke-width="1"/>
    <!-- Terminal / Code Icon -->
    <path d="M12 14L16 18L12 22M19 22H24" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Section Text -->
  <g transform="translate(74, 0)">
    <!-- Category Tag -->
    <text x="0" y="22" class="tag-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1.2">
      // 01. PROFILE &amp; PHILOSOPHY
    </text>

    <!-- Main Title & Subtitle -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <tspan font-size="16" font-weight="800" class="title-main">About Me</tspan>
      <tspan dx="10" font-size="13" font-weight="500" class="title-sub">— Backend Engineer focused on clean, scalable systems</tspan>
    </text>
  </g>
</svg>
