<svg viewBox="0 0 740 230" fill="none" xmlns="http://www.w3.org/2000/svg" style="max-width:740px;display:block;">
  <defs>
    <!-- Vibrant Glowing Border -->
    <linearGradient id="borderGradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="35%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Top Accent Bar Gradient -->
    <linearGradient id="topBarClean" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Subtle Glass Background -->
    <linearGradient id="heroGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <style>
    .title-text { fill: #0F172A; }
    .subtitle-text { fill: #475569; }
    .breadcrumb-text { fill: #64748B; }
    .chip-bg { fill: rgba(148, 163, 184, 0.08); stroke: rgba(148, 163, 184, 0.25); }
    .chip-text { fill: #1E293B; }
    .role-bg { fill: rgba(2, 132, 199, 0.1); stroke: #0284C7; }
    .role-text { fill: #0284C7; }
    .divider-line { stroke: rgba(148, 163, 184, 0.2); }

    @media (prefers-color-scheme: dark) {
      .title-text { fill: #FFFFFF; }
      .subtitle-text { fill: #94A3B8; }
      .breadcrumb-text { fill: #8B949E; }
      .chip-bg { fill: rgba(255, 255, 255, 0.08); stroke: rgba(255, 255, 255, 0.18); }
      .chip-text { fill: #F0F6FC; }
      .role-bg { fill: rgba(56, 189, 248, 0.15); stroke: #38BDF8; }
      .role-text { fill: #38BDF8; }
      .divider-line { stroke: rgba(255, 255, 255, 0.12); }
    }
  </style>

  <!-- Clear Vibrant Outer Frame -->
  <rect x="0.75" y="0.75" width="738.5" height="228.5" rx="12" stroke="url(#borderGradHero)" stroke-width="1.5" fill="url(#heroGlass)"/>

  <!-- Top Accent Line -->
  <rect x="12" y="1" width="716" height="3" rx="1.5" fill="url(#topBarClean)"/>

  <!-- WINDOW CONTROLS & BREADCRUMB -->
  <circle cx="28" cy="22" r="4.5" fill="#EF4444" fill-opacity="0.85"/>
  <circle cx="42" cy="22" r="4.5" fill="#F59E0B" fill-opacity="0.85"/>
  <circle cx="56" cy="22" r="4.5" fill="#10B981" fill-opacity="0.85"/>

  <text x="74" y="26" class="breadcrumb-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="500">
    noureddine-osama / main / backend-developer.cs
  </text>

  <!-- Divider Line -->
  <line x1="20" y1="38" x2="720" y2="38" class="divider-line" stroke-width="1"/>

  <!-- ROLE CAPSULE -->
  <g transform="translate(24, 48)">
    <rect width="206" height="24" rx="12" class="role-bg" stroke-width="1"/>
    <!-- Bolt Icon -->
    <path d="M14 13L18 7H22L19 11.5H23L16 18L17.5 13.5H14V13Z" fill="#0284C7"/>
    <text x="28" y="16.5" class="role-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8">
      .NET BACKEND DEVELOPER
    </text>
  </g>

  <!-- MAIN NAME -->
  <text x="24" y="106" class="title-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Noureddine Osama
  </text>

  <!-- VALUE STATEMENT / SUBTITLE -->
  <text x="24" y="132" class="subtitle-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500">
    Building High-Performance APIs, Resilient Cloud Services &amp; Clean Domain Architectures
  </text>

  <!-- TECH CHIPS - ROW 1 -->
  <g transform="translate(24, 152)">
    <!-- Chip 1: C# 14 -->
    <g transform="translate(0, 0)">
      <rect width="58" height="26" rx="6" class="chip-bg" stroke-width="1"/>
      <text x="29" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#8B5CF6" text-anchor="middle">C# 14</text>
    </g>

    <!-- Chip 2: .NET 10 -->
    <g transform="translate(66, 0)">
      <rect width="68" height="26" rx="6" class="chip-bg" stroke-width="1"/>
      <text x="34" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#0284C7" text-anchor="middle">.NET 10</text>
    </g>

    <!-- Chip 3: ASP.NET Core -->
    <g transform="translate(142, 0)">
      <rect width="112" height="26" rx="6" class="chip-bg" stroke-width="1"/>
      <text x="56" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#0284C7" text-anchor="middle">ASP.NET Core</text>
    </g>

    <!-- Chip 4: Clean Architecture -->
    <g transform="translate(262, 0)">
      <rect width="134" height="26" rx="6" class="chip-bg" stroke-width="1"/>
      <text x="67" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Clean Architecture</text>
    </g>

    <!-- Chip 5: CQRS / MediatR -->
    <g transform="translate(404, 0)">
      <rect width="122" height="26" rx="6" class="chip-bg" stroke-width="1"/>
      <text x="61" y="17" class="chip-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">CQRS / MediatR</text>
    </g>

    <!-- Chip 6: PostgreSQL -->
    <g transform="translate(534, 0)">
      <rect width="90" height="26" rx="6" class="chip-bg" stroke-width="1"/>
      <text x="45" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#38BDF8" text-anchor="middle">PostgreSQL</text>
    </g>

    <!-- Chip 7: Docker -->
    <g transform="translate(632, 0)">
      <rect width="66" height="26" rx="6" class="chip-bg" stroke-width="1"/>
      <text x="33" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#10B981" text-anchor="middle">Docker</text>
    </g>
  </g>

  <!-- SUB ROW: Key Indicators -->
  <g transform="translate(24, 192)">
    <circle cx="5" cy="8" r="3" fill="#10B981"/>
    <text x="14" y="11.5" class="breadcrumb-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">
      Available for backend engineering roles &amp; high-impact systems
    </text>
  </g>
</svg>
