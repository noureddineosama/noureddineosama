<svg width="900" height="52" viewBox="0 0 900 52" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barStats" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <style>
    .title-main { fill: #0F172A; }
    .title-sub { fill: #64748B; }
    .tag-text { fill: #059669; }
    .icon-box { fill: rgba(16, 185, 129, 0.08); stroke: rgba(16, 185, 129, 0.3); }

    @media (prefers-color-scheme: dark) {
      .title-main { fill: #F0F6FC; }
      .title-sub { fill: #94A3B8; }
      .tag-text { fill: #34D399; }
      .icon-box { fill: rgba(52, 211, 153, 0.12); stroke: rgba(52, 211, 153, 0.25); }
    }
  </style>

  <!-- Left Accent Bar -->
  <rect x="0" y="4" width="4" height="44" rx="2" fill="url(#barStats)"/>

  <!-- Left Icon Badge -->
  <g transform="translate(16, 8)">
    <rect width="36" height="36" rx="8" class="icon-box" stroke-width="1"/>
    <!-- Pulse / Chart Icon -->
    <path d="M10 23L15 15L19 21L23 13L26 23" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Section Text -->
  <g transform="translate(64, 0)">
    <!-- Category Tag -->
    <text x="0" y="19" class="tag-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1.2">
      // 03. METRICS &amp; CONSISTENCY
    </text>

    <!-- Main Title & Subtitle -->
    <text x="0" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <tspan font-size="16" font-weight="800" class="title-main">GitHub Activity</tspan>
      <tspan dx="10" font-size="13" font-weight="500" class="title-sub">— Contribution streak, commits &amp; open-source velocity</tspan>
    </text>
  </g>
</svg>
