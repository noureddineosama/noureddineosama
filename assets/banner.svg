<svg width="900" height="190" viewBox="0 0 900 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- White background with border -->
  <rect width="900" height="190" rx="6" fill="#FFFFFF"/>
  <rect x="0.75" y="0.75" width="898.5" height="188.5" rx="5.25" stroke="#D0D7DE" stroke-width="1.5"/>
  <!-- Top accent bar - GitHub blue -->
  <rect x="0" y="0" width="900" height="4" rx="2" fill="#0969DA"/>

  <!-- Role Badge -->
  <rect x="350" y="26" width="200" height="22" rx="11" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1"/>
  <text x="450" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#0969DA" text-anchor="middle" letter-spacing="1.5">.NET BACKEND DEVELOPER</text>

  <!-- Name -->
  <text x="450" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="46" font-weight="800" fill="#1F2328" text-anchor="middle" letter-spacing="-1">Noureddine Osama</text>

  <!-- Blue underline accent -->
  <rect x="310" y="112" width="280" height="2.5" rx="1.25" fill="#0969DA"/>

  <!-- Subtitle -->
  <text x="450" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#636C76" text-anchor="middle">C#  |  ASP.NET Core  |  Clean Architecture  |  PostgreSQL  |  Docker</text>

  <!-- Status chips row -->
  <g transform="translate(222, 158)">
    <!-- Available -->
    <rect x="0" y="0" width="132" height="22" rx="11" fill="#DAFBE1" stroke="#82E0A8" stroke-width="1"/>
    <circle cx="14" cy="11" r="4" fill="#1A7F37"/>
    <text x="24" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#1A7F37">Available for Roles</text>

    <!-- .NET 10 -->
    <rect x="144" y="0" width="110" height="22" rx="11" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1"/>
    <text x="199" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#0969DA" text-anchor="middle">.NET 10 / C# 13</text>

    <!-- Open Source -->
    <rect x="266" y="0" width="134" height="22" rx="11" fill="#FFF8C5" stroke="#E3B341" stroke-width="1"/>
    <text x="333" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#9A6700" text-anchor="middle">Open Source Contributor</text>
  </g>
</svg>
