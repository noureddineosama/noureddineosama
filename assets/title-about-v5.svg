<svg viewBox="0 0 320 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;">
  <defs>
    <!-- Vibrant Glowing Border -->
    <linearGradient id="badgeBorderAbout" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Subtle Glass Background -->
    <linearGradient id="badgeGlassAbout" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Left Accent Bar -->
    <linearGradient id="barAboutPill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <style>
    .title-main { fill: #0F172A; }
    .tag-text { fill: #0284C7; }
    .icon-box { fill: rgba(2, 132, 199, 0.12); stroke: #0284C7; }

    @media (prefers-color-scheme: dark) {
      .title-main { fill: #FFFFFF; }
      .tag-text { fill: #38BDF8; }
      .icon-box { fill: rgba(56, 189, 248, 0.15); stroke: #38BDF8; }
    }
  </style>

  <!-- Frame -->
  <rect x="0.75" y="0.75" width="318.5" height="46.5" rx="10" stroke="url(#badgeBorderAbout)" stroke-width="1.5" fill="url(#badgeGlassAbout)"/>

  <!-- Left Accent -->
  <path d="M0 10C0 4.477 4.477 0 10 0H12V48H10C4.477 48 0 43.523 0 38V10Z" fill="url(#barAboutPill)"/>

  <!-- Icon Badge -->
  <g transform="translate(20, 9)">
    <rect width="30" height="30" rx="7" class="icon-box" stroke-width="1"/>
    <!-- Terminal Icon -->
    <path d="M10 11L14 15L10 19M16 19H20" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text -->
  <g transform="translate(60, 0)">
    <text x="0" y="19" class="tag-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1">
      // 01. PROFILE &amp; PHILOSOPHY
    </text>
    <text x="0" y="37" class="title-main" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="-0.3">
      About Me
    </text>
  </g>
</svg>
