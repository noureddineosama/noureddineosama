<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#F0F6FF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Top Accent Gradient -->
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969DA"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Accent Underline -->
    <linearGradient id="nameUnderline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969DA" stop-opacity="0"/>
      <stop offset="25%" stop-color="#0969DA"/>
      <stop offset="75%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Glow Left & Right -->
    <radialGradient id="glowLeft" cx="0%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#BFDBFE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#BFDBFE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="100%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#DDD6FE" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#DDD6FE" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for subtle drop shadow on tag -->
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0969DA" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Border -->
  <rect x="0.75" y="0.75" width="898.5" height="238.5" rx="15.25" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Top Accent Bar -->
  <path d="M 0 16 Q 0 0 16 0 L 884 0 Q 900 0 900 16 L 900 5 L 0 5 Z" fill="url(#topBar)"/>

  <!-- Ambient Glows -->
  <ellipse cx="60" cy="120" rx="180" ry="110" fill="url(#glowLeft)"/>
  <ellipse cx="840" cy="120" rx="180" ry="110" fill="url(#glowRight)"/>

  <!-- Dot Matrix Decoration (Left) -->
  <g fill="#CBD5E1" opacity="0.7">
    <circle cx="36" cy="40" r="1.7"/>
    <circle cx="52" cy="40" r="1.7"/>
    <circle cx="68" cy="40" r="1.7"/>
    <circle cx="84" cy="40" r="1.7"/>
    <circle cx="36" cy="56" r="1.7"/>
    <circle cx="52" cy="56" r="1.7"/>
    <circle cx="68" cy="56" r="1.7"/>
    <circle cx="84" cy="56" r="1.7"/>
    <circle cx="36" cy="72" r="1.7"/>
    <circle cx="52" cy="72" r="1.7"/>
    <circle cx="68" cy="72" r="1.7"/>
    <circle cx="84" cy="72" r="1.7"/>
  </g>

  <!-- Dot Matrix Decoration (Right) -->
  <g fill="#CBD5E1" opacity="0.7">
    <circle cx="816" cy="168" r="1.7"/>
    <circle cx="832" cy="168" r="1.7"/>
    <circle cx="848" cy="168" r="1.7"/>
    <circle cx="864" cy="168" r="1.7"/>
    <circle cx="816" cy="184" r="1.7"/>
    <circle cx="832" cy="184" r="1.7"/>
    <circle cx="848" cy="184" r="1.7"/>
    <circle cx="864" cy="184" r="1.7"/>
    <circle cx="816" cy="200" r="1.7"/>
    <circle cx="832" cy="200" r="1.7"/>
    <circle cx="848" cy="200" r="1.7"/>
    <circle cx="864" cy="200" r="1.7"/>
  </g>

  <!-- Code Watermarks - Left -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace" font-size="11" fill="#0969DA" fill-opacity="0.16">
    <text x="36" y="112">public interface IBackendService {</text>
    <text x="48" y="130">Task&lt;Result&gt; ProcessAsync();</text>
    <text x="36" y="148">}</text>
  </g>

  <!-- Code Watermarks - Right -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace" font-size="11" fill="#6366F1" fill-opacity="0.16">
    <text x="710" y="78">app.MapEndpoints();</text>
    <text x="710" y="96">await app.RunAsync();</text>
  </g>

  <!-- Decorative Brackets -->
  <text x="110" y="152" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="96" font-weight="900" fill="#0969DA" fill-opacity="0.05">{</text>
  <text x="750" y="152" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="96" font-weight="900" fill="#6366F1" fill-opacity="0.05">}</text>

  <!-- Top Pill / Role Badge -->
  <g filter="url(#softShadow)">
    <rect x="330" y="32" width="240" height="26" rx="13" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.2"/>
    <circle cx="346" cy="45" r="4.5" fill="#0969DA"/>
    <text x="358" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#0969DA" letter-spacing="1.2">.NET BACKEND DEVELOPER</text>
  </g>

  <!-- Main Name Header -->
  <text x="450" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="-1">Noureddine Osama</text>

  <!-- Gradient Accent Underline -->
  <rect x="290" y="116" width="320" height="3" rx="1.5" fill="url(#nameUnderline)"/>

  <!-- Subtitle -->
  <text x="450" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" fill="#475569" text-anchor="middle" letter-spacing="0.3">C# &amp; ASP.NET Core &nbsp;•&nbsp; Clean Architecture &nbsp;•&nbsp; PostgreSQL &nbsp;•&nbsp; Scalable Cloud APIs</text>

  <!-- Bottom Badges / Chips Group -->
  <g transform="translate(195, 172)">
    <!-- Chip 1: Open to Work -->
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
    <circle cx="16" cy="13" r="4.5" fill="#16A34A"/>
    <text x="27" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#15803D">Available for Roles</text>

    <!-- Chip 2: .NET 10 & C# -->
    <rect x="152" y="0" width="186" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="245" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle">⚡ .NET 10 &amp; Modern C#</text>

    <!-- Chip 3: Clean Code & Architecture -->
    <rect x="350" y="0" width="160" height="26" rx="13" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="430" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">🏗️ Clean Architecture</text>
  </g>
</svg>
