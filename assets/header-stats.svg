<svg width="900" height="60" viewBox="0 0 900 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgStatsClean" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderStatsClean" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#0284C7" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Accent Bar Gradient -->
    <linearGradient id="barStatsClean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="900" height="60" rx="10" fill="url(#bgStatsClean)"/>
  <rect x="0.75" y="0.75" width="898.5" height="58.5" rx="9.25" stroke="url(#borderStatsClean)" stroke-width="1.5"/>

  <!-- Left Accent Bar -->
  <path d="M0 10C0 4.477 4.477 0 10 0H14V60H10C4.477 60 0 55.523 0 50V10Z" fill="url(#barStatsClean)"/>

  <!-- Left Icon Badge -->
  <g transform="translate(28, 12)">
    <rect width="36" height="36" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <!-- Pulse / Activity Chart Icon -->
    <path d="M10 23L15 15L19 21L23 13L26 23" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Section Text -->
  <g transform="translate(76, 0)">
    <!-- Category Mono Tag -->
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700" fill="#059669" letter-spacing="1.2">
      // 03. METRICS &amp; CONSISTENCY
    </text>

    <!-- Main Title & Subtitle -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <tspan font-size="16" font-weight="800" fill="#0F172A">GitHub Activity</tspan>
      <tspan dx="10" font-size="13" font-weight="500" fill="#64748B">— Contribution streak, commits &amp; open-source velocity</tspan>
    </text>
  </g>
</svg>
